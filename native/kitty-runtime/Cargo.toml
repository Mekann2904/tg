[package]
name = "kitty-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kitty-runtime"
path = "src/main.rs"

[[bin]]
name = "shm-probe"
path = "src/shm_probe.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
